[package]
name = "leave-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# OpenMLS 0.9 is used instead of 0.8: the 0.8 provider graph pins
# libcrux-secrets =0.0.5 and libcrux-sha3 0.0.8, both carrying unfixable
# high-severity advisories. The 0.9 graph audits clean.
chacha20poly1305 = "0.10.1"
openmls = "0.9.0-rc.4"
openmls_basic_credential = "0.6.0-rc.4"
openmls_memory_storage = "0.6.0-rc.4"
openmls_rust_crypto = "0.6.0-rc.4"
openmls_traits = "0.6.0-rc.4"
serde.workspace = true
thiserror.workspace = true
tls_codec = "0.4.2"
zeroize.workspace = true

[lints]
workspace = true
