[package]
name = "leave-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
openmls-experimental = [
  "dep:openmls",
  "dep:openmls_basic_credential",
  "dep:openmls_rust_crypto",
  "dep:wasm-bindgen",
]

[dependencies]
openmls = { version = "0.8.1", optional = true }
openmls_basic_credential = { version = "0.5", optional = true }
openmls_rust_crypto = { version = "0.5", optional = true }
serde.workspace = true
thiserror.workspace = true
wasm-bindgen = { version = "0.2", optional = true }
zeroize.workspace = true

[lints]
workspace = true
