[package]
name = "leave-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The OpenMLS provider is not declared until the transport that uses it exists.
# Declaring it early put six unused advisory-carrying crates in the lockfile,
# which `cargo audit` reports whether or not any of them is ever compiled.
# Re-add the dependency in the same change that starts using it.

[dependencies]
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[lints]
workspace = true
