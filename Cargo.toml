[workspace]
resolver = "2"
members = [
  "apps/leave",
  "apps/relay",
  "crates/leave-core",
  "crates/leave-crypto",
  "crates/leave-protocol",
  "crates/leave-transport",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/leave-cli/leave"
rust-version = "1.98"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0"
async-trait = "0.1"
atomic-write-file = "0.3.1"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "tokio", "ws"] }
blake3 = "1.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
keyring = "4.1.6"
portable-pty = "0.9.0"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["derive", "json", "migrate", "postgres", "runtime-tokio", "sqlite", "time", "uuid"] }
redis = { version = "1.6", features = ["tokio-comp"] }
subtle = "2.6"
thiserror = "2.0"
tempfile = "3.21"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.29"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
